name: Build and optionally deploy documentation
on:
  push:
jobs:
  # Note: we explicitly *build* the documentation in a job with minimal permissions.
  build:
    name: Build static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Build documentation
        run: uv run zensical build
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: site
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
  deploy:
    name: Deploy to GitHub pages
    # Only try to deploy to pages if we're running on the main branch. We use ref/heads because,
    # technically, one could create a "tag" named main too.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from GitHub itself
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
